<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Simulado Cesgranrio</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; font-size: 28px; }
        h2 { color: #333; margin-bottom: 20px; text-align: center; }
        h3 { color: #333; margin-bottom: 15px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input[type="password"] {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 16px; transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #e0e0e0;
        }
        .admin-header h2 { margin: 0; text-align: left; }
        .logout-btn {
            padding: 8px 16px; background: #e74c3c; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        .user-list { list-style: none; }
        .user-item {
            background: #f8f9fa; padding: 15px; margin-bottom: 10px;
            border-radius: 8px; display: flex; justify-content: space-between;
            align-items: center; border-left: 4px solid #667eea;
            flex-wrap: wrap; gap: 10px;
        }
        .user-item.approved { border-left-color: #27ae60; }
        .user-email { flex: 1; font-weight: 600; color: #333; min-width: 200px; }
        .user-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .action-btn {
            padding: 6px 12px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 13px; font-weight: 600; margin-left: 5px;
        }
        .approve-btn { background: #27ae60; color: white; }
        .remove-btn { background: #e74c3c; color: white; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .error-message {
            background: #fee; color: #c33; padding: 10px; border-radius: 6px;
            margin-bottom: 15px; display: none; border-left: 4px solid #c33;
        }
        .error-message.show { display: block; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .spinner {
            border: 3px solid #f3f3f3; border-top: 3px solid #667eea;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; margin-bottom: 30px;
        }
        .stat-card {
            background: #f8f9fa; padding: 20px; border-radius: 8px;
            text-align: center; border-left: 4px solid #667eea;
        }
        .stat-number { font-size: 32px; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; font-size: 14px; margin-top: 5px; }
        .link-text { text-align: center; margin-top: 20px; color: #666; font-size: 14px; }
        .link-text a { color: #667eea; text-decoration: none; font-weight: 600; }
        .link-text a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 22px; }
            .user-item { flex-direction: column; align-items: flex-start; }
            .user-email { margin-bottom: 10px; }
            .admin-header { flex-direction: column; gap: 15px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tela de Login do Administrador -->
        <div id="adminLoginScreen" class="screen active">
            <h1>🔐 Acesso Administrativo</h1>
            <p class="subtitle">Área restrita</p>
            <div id="adminLoginError" class="error-message"></div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminPassword">Senha do Administrador:</label>
                    <input type="password" id="adminPassword" required placeholder="Digite a senha">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p class="link-text">
                <a href="index.html">← Voltar para o início</a>
            </p>
        </div>

        <!-- Painel do Administrador -->
        <div id="adminPanel" class="screen">
            <div class="admin-header">
                <h2>👤 Painel do Administrador</h2>
                <button class="logout-btn" onclick="adminLogout()">Sair</button>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Total de Usuários</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingUsers">0</div>
                    <div class="stat-label">Pendentes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="approvedUsers">0</div>
                    <div class="stat-label">Aprovados</div>
                </div>
            </div>
            <h3>Usuários Cadastrados</h3>
            <div id="loadingUsers" class="loading">
                <div class="spinner"></div>
                <p>Carregando usuários...</p>
            </div>
            <div id="userListContainer" style="display: none;">
                <ul id="userList" class="user-list"></ul>
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>Nenhum usuário cadastrado ainda</p>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // ⚠️ CONFIGURAÇÃO DO FIREBASE - SUBSTITUA COM SEUS DADOS
        // =====================================================
        const firebaseConfig = {
            apiKey: "COLE_SUA_API_KEY_AQUI",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO_ID",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const ADMIN_PASSWORD = 'Atlanta';
        const USERS_COLLECTION = 'users';

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // =====================================================
        // LÓGICA DO PAINEL ADMINISTRATIVO
        // =====================================================
        const ADMIN_SESSION_KEY = 'simulado_admin_session';

        document.addEventListener('DOMContentLoaded', function() {
            verificarSessaoAdmin();
        });

        function verificarSessaoAdmin() {
            const adminSession = localStorage.getItem(ADMIN_SESSION_KEY);
            if (adminSession === 'true') {
                mostrarTela('adminPanel');
                carregarUsuarios();
            }
        }

        function mostrarTela(screenId) {
            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function mostrarErro(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem(ADMIN_SESSION_KEY, 'true');
                mostrarTela('adminPanel');
                carregarUsuarios();
            } else {
                mostrarErro('adminLoginError', 'Senha incorreta');
            }
        });

        async function carregarUsuarios() {
            const loadingDiv = document.getElementById('loadingUsers');
            const userListContainer = document.getElementById('userListContainer');
            const emptyState = document.getElementById('emptyState');

            try {
                const snapshot = await db.collection(USERS_COLLECTION)
                    .orderBy('registeredAt', 'desc')
                    .get();

                loadingDiv.style.display = 'none';

                if (snapshot.empty) {
                    emptyState.style.display = 'block';
                    atualizarEstatisticas(0, 0, 0);
                    return;
                }

                const users = [];
                let total = 0, pending = 0, approved = 0;

                snapshot.forEach(doc => {
                    const userData = doc.data();
                    users.push({ id: doc.id, ...userData });
                    total++;
                    if (userData.approved) approved++;
                    else pending++;
                });

                atualizarEstatisticas(total, pending, approved);
                renderizarListaUsuarios(users);
            } catch (error) {
                console.error('Erro ao carregar usuários:', error);
                loadingDiv.innerHTML = '<p style="color: #c33;">Erro ao carregar usuários</p>';
            }
        }

        function atualizarEstatisticas(total, pending, approved) {
            document.getElementById('totalUsers').textContent = total;
            document.getElementById('pendingUsers').textContent = pending;
            document.getElementById('approvedUsers').textContent = approved;
        }

        function renderizarListaUsuarios(users) {
            const userList = document.getElementById('userList');
            const userListContainer = document.getElementById('userListContainer');
            const emptyState = document.getElementById('emptyState');

            if (users.length === 0) {
                userListContainer.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            userListContainer.style.display = 'block';

            userList.innerHTML = users.map(user => {
                const dataRegistro = user.registeredAt ? 
                    new Date(user.registeredAt.seconds * 1000).toLocaleDateString('pt-BR') : 
                    'Data não disponível';

                return `
                    <li class="user-item ${user.approved ? 'approved' : ''}">
                        <div class="user-email">
                            ${user.email}
                            <div style="font-size: 12px; color: #999; font-weight: normal; margin-top: 4px;">
                                Cadastrado em: ${dataRegistro}
                            </div>
                        </div>
                        <span class="user-status ${user.approved ? 'status-approved' : 'status-pending'}">
                            ${user.approved ? '✓ Aprovado' : '⏳ Pendente'}
                        </span>
                        <div>
                            ${!user.approved ? `<button class="action-btn approve-btn" onclick="aprovarUsuario('${user.id}')">Aprovar</button>` : ''}
                            <button class="action-btn remove-btn" onclick="removerUsuario('${user.id}', '${user.email}')">Remover</button>
                        </div>
                    </li>
                `;
            }).join('');
        }

        async function aprovarUsuario(userId) {
            if (!confirm('Tem certeza que deseja aprovar este usuário?')) return;
            try {
                await db.collection(USERS_COLLECTION).doc(userId).update({ approved: true });
                carregarUsuarios();
            } catch (error) {
                console.error('Erro ao aprovar usuário:', error);
                alert('Erro ao aprovar usuário. Tente novamente.');
            }
        }

        async function removerUsuario(userId, email) {
            if (!confirm(`Tem certeza que deseja remover o usuário ${email}?`)) return;
            try {
                await db.collection(USERS_COLLECTION).doc(userId).delete();
                carregarUsuarios();
            } catch (error) {
                console.error('Erro ao remover usuário:', error);
                alert('Erro ao remover usuário. Tente novamente.');
            }
        }

        function adminLogout() {
            localStorage.removeItem(ADMIN_SESSION_KEY);
            mostrarTela('adminLoginScreen');
            document.getElementById('adminLoginForm').reset();
        }
    </script>
</body>
</html>
