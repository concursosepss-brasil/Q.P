<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    background: #0d2a52;

    background: #e5e9f0;
    height: 10px;

    margin: 18px 28px 0;

  }
  .progress-bar {
    height: 100%;
    width: 0%;

  @keyframes fade { from {opacity:0; transform:translateY(8px);} to {opacity:1; transform:none;} }
  .q-number {
    display: inline-block;
    background: #0d2a52;
    color: #fff;

    line-height: 1.7;

    font-size: 1.05rem;

    background: #fafbfd;

  .nav-buttons {

  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: #6c757d; }

  .start-screen, .result-screen { text-align: center; padding: 20px 10px; }
  .start-screen h2 { color: #0d2a52; margin-bottom: 16px; font-size: 1.6rem; }
  .start-screen p { margin-bottom: 14px; color: #555; line-height: 1.6; }
  .start-screen ul { text-align: left; max-width: 500px; margin: 18px auto; color: #444; }

  .review-list { text-align: left; margin: 24px 0; }

  .review-item small { color: #666; display: block; margin-top: 4px; }
  footer { text-align: center; padding: 14px; background: #f4f7fb; font-size: .8rem; color: #666; }

  .gate-screen h2 { color: #0d2a52; margin-bottom: 14px; font-size: 1.5rem; }
  .gate-screen p { color: #555; line-height: 1.6; margin-bottom: 18px; max-width: 460px; margin-left: auto; margin-right: auto; }
  .form-field { max-width: 380px; margin: 0 auto 16px; text-align: left; }
  .form-field label { display: block; font-size: .85rem; color: #444; margin-bottom: 6px; font-weight: 600; }
  .form-field input {
    width: 100%; padding: 12px 14px; border: 2px solid #e1e6ef; border-radius: 8px;
    font-size: 1rem; transition: border-color .2s;
  }
  .form-field input:focus { outline: none; border-color: #2a5298; }
  .status-badge {
    display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: .9rem;

  }
  .status-badge.pending { background: #fff3cd; color: #856404; }
  .status-badge.rejected { background: #fdecea; color: #721c24; }

  .admin-table th, .admin-table td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; }
  .admin-table th { background: #f4f7fb; color: #0d2a52; }
  .admin-actions button { padding: 6px 12px; font-size: .82rem; margin-right: 6px; }
  .admin-empty { color: #888; padding: 16px 0; font-style: italic; }
  footer a { color: #2a5298; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .error-msg { color: #dc3545; font-size: .88rem; margin-top: -8px; margin-bottom: 14px; display: none; }
  .error-msg.show { display: block; }
  @media (max-width: 600px) {
    header h1 { font-size: 1.15rem; }
    main { padding: 18px; }
    .score-big { font-size: 2.2rem; }
  }

<script>
const Q=[
{c:"A Lei nº 9.394/1996 (LDB) estabelece, em seu artigo 3º, os princípios que devem nortear o ensino no Brasil. Entre eles, estão a igualdade de condições para o acesso e permanência na escola, a liberdade de aprender, ensinar, pesquisar e divulgar a cultura, o pensamento, a arte e o saber, e o respeito à liberdade e apreço à tolerância. A legislação também prevê a coexistência de instituições públicas e privadas de ensino, refletindo a atuação conjunta do Estado e da iniciativa privada na oferta educacional.",t:"De acordo com o artigo 3º da LDB, constitui um dos princípios do ensino no Brasil:",o:["A padronização curricular nacional única, sem flexibilizações regionais.","A centralização administrativa exclusiva nos municípios.","A eliminação progressiva da gestão democrática no ensino público.","A obrigatoriedade do ensino religioso confessional em todas as escolas.","A coexistência de instituições públicas e privadas de ensino."],a:4,e:"O art. 3º, inciso XI, da LDB prevê a 'coexistência de instituições públicas e privadas de ensino' como princípio."},
{c:"A gestão democrática do ensino público é um princípio constitucional (CF/88, art. 206, VI) e está regulamentada no artigo 14 da LDB. Esse princípio visa superar o modelo centralizador e autoritário, promovendo a autonomia da escola e a participação efetiva de todos os segmentos da comunidade escolar nas decisões pedagógicas, administrativas e financeiras. A participação é considerada um mecanismo fundamental para a transparência, o controle social e a melhoria da qualidade da educação.",t:"Segundo o artigo 14 da LDB, a gestão democrática do ensino público será garantida por meio de:",o:["Decisões centralizadas exclusivamente na secretaria de educação.","Participação dos profissionais na elaboração do projeto pedagógico e das comunidades em conselhos escolares.","Autonomia plena das escolas para criar impostos próprios.","Indicação política de diretores sem consulta à comunidade.","Exclusão dos estudantes dos processos decisórios."],a:1,e:"O art. 14 da LDB determina a participação dos profissionais na elaboração do projeto pedagógico e das comunidades em conselhos escolares."},
{c:"Jean Piaget, em sua teoria do desenvolvimento cognitivo, descreve estágios universais e sequenciais pelos quais a criança passa. Em um desses estágios, a criança já é capaz de realizar operações lógicas, como classificação, seriação e conservação, mas seu pensamento ainda depende de suporte em objetos concretos e situações palpáveis para que a lógica seja aplicada. O egocentrismo intelectual começa a ser superado, permitindo que a criança considere diferentes perspectivas.",t:"Um aluno de 9 anos, que resolve problemas matemáticos manipulando objetos concretos, mas já realiza operações lógicas simples, encontra-se, segundo Piaget, no estágio:",o:["Sensório-motor.","Operatório formal.","Pré-operatório.","Operatório concreto.","Pós-operatório abstrato."],a:3,e:"No estágio operatório concreto (aprox. 7 a 11/12 anos), a criança realiza operações lógicas, mas ainda necessita de apoio em objetos concretos."},
{c:"Emília Ferreiro e Ana Teberosky, em suas pesquisas sobre a psicogênese da língua escrita, demonstraram que as crianças constroem hipóteses sobre o funcionamento do sistema de escrita antes mesmo de serem formalmente alfabetizadas. Em um determinado nível, a criança descobre que a escrita representa a fala e começa a estabelecer uma correspondência entre as partes sonoras das palavras (sílabas) e as letras, podendo atribuir uma letra para cada sílaba, ainda sem valor sonoro convencional.",t:"Uma aluna escreve 'TMTE' para 'TOMATE', atribuindo uma letra para cada sílaba, sem valor sonoro convencional. De acordo com Ferreiro, ela está no nível:",o:["Pré-silábico.","Silábico-alfabético.","Ortográfico avançado.","Alfabético.","Silábico."],a:4,e:"Na hipótese silábica, a criança estabelece correspondência entre sílabas faladas e letras escritas, ainda sem valor sonoro convencional."},
{c:"A Base Nacional Comum Curricular (BNCC) define o conjunto de aprendizagens essenciais que todos os alunos devem desenvolver ao longo da educação básica. O documento está estruturado em dez competências gerais, que articulam dimensões cognitivas, socioemocionais, éticas e estéticas. A primeira competência geral enfatiza a importância de mobilizar conhecimentos para compreender e transformar a realidade, promovendo uma sociedade justa, democrática e inclusiva.",t:"Dentre as competências gerais da BNCC, destaca-se:",o:["Priorizar exclusivamente o conteúdo disciplinar tradicional.","Restringir o uso de tecnologias digitais ao ensino médio.","Valorizar e utilizar os conhecimentos historicamente construídos sobre o mundo físico, social, cultural e digital para entender e transformar a realidade.","Eliminar manifestações culturais regionais em favor de uma cultura homogênea.","Desconsiderar a diversidade cultural brasileira no currículo."],a:2,e:"A competência geral 1 da BNCC valoriza os conhecimentos sobre o mundo físico, social, cultural e digital para compreender e transformar a realidade."},
{c:"A quinta competência geral da BNCC aborda a cultura digital. Em um mundo cada vez mais mediado por tecnologias, a escola tem o desafio de preparar os estudantes não apenas para consumir informações, mas para produzir conhecimentos, comunicar-se e resolver problemas de forma responsável. O documento enfatiza que o uso das tecnologias deve ir além do domínio instrumental, exigindo uma postura crítica e ética.",t:"A BNCC, em sua competência geral 5, prevê que os estudantes devem:",o:["Compreender, utilizar e criar tecnologias digitais de informação e comunicação de forma crítica, significativa, reflexiva e ética.","Depender exclusivamente de plataformas privadas de ensino.","Utilizar as tecnologias apenas em aulas de informática isoladas.","Utilizar linguagens digitais apenas para fins de entretenimento.","Evitar o uso de tecnologias digitais até o ensino médio."],a:0,e:"A competência geral 5 trata do uso crítico, significativo, reflexivo e ético das tecnologias digitais de informação e comunicação."},
{c:"Lev Vygotsky, em sua teoria sociocultural, enfatiza que o desenvolvimento cognitivo ocorre por meio da interação social e da mediação cultural. Para o autor, a aprendizagem antecede o desenvolvimento e impulsiona processos internos que só se tornam efetivos através da relação com o outro. Ele conceitua uma zona específica onde a criança não consegue realizar uma tarefa sozinha, mas consegue realizá-la com a ajuda de um adulto ou de um par mais experiente.",t:"Essa zona, segundo Vygotsky, é denominada:",o:["Zona de desenvolvimento real.","Zona de maturação biológica.","Zona de assimilação pura.","Zona de desenvolvimento proximal.","Zona de equilíbrio cognitivo."],a:3,e:"A Zona de Desenvolvimento Proximal (ZDP) é a distância entre o desenvolvimento real (o que a criança faz sozinha) e o desenvolvimento potencial (o que faz com ajuda)."},
{c:"Henri Wallon concebe o desenvolvimento humano como um processo dialético, marcado por alternâncias e integrações entre as dimensões afetiva, motora e cognitiva. Para ele, a emoção e o movimento são formas fundamentais de inteligência e expressão nos primeiros anos de vida. A escola, na perspectiva walloniana, deve acolher a criança em sua totalidade, reconhecendo que o corpo e a afetividade são indissociáveis do processo de conhecimento.",t:"Um professor, ao lidar com um aluno agitado, decide incorporar atividades corporais e afetivas, reconhecendo a motricidade como linguagem. Essa prática fundamenta-se em:",o:["Pedagogia tradicional, que homogeneíza a turma.","Teoria da inteligência emocional desvinculada da cognição.","Teoria de Piaget, focada apenas na lógica.","Perspectiva de Wallon, que integra afetividade, motricidade e cognição.","Behaviorismo, que enfatiza o reforço individual."],a:3,e:"Wallon destaca a importância da afetividade e da motricidade como dimensões constitutivas do desenvolvimento e da aprendizagem."},
{c:"Jussara Hoffmann, em sua obra sobre avaliação mediadora, critica as práticas avaliativas classificatórias e excludentes. Para a autora, a avaliação deve ser um ato de amor e de diálogo, um processo contínuo de interpretação e intervenção pedagógica. O erro não deve ser visto como falta de capacidade, mas como uma pista valiosa sobre o raciocínio do aluno, indicando o caminho para novas mediações e aprendizagens.",t:"Segundo Hoffmann, a avaliação mediadora caracteriza-se por:",o:["Utilizar apenas provas objetivas, descartando trabalhos e projetos.","Acompanhar a trajetória do aluno, interpretando suas produções e promovendo ações pedagógicas que favoreçam novas aprendizagens.","Aplicar provas padronizadas ao final de cada bimestre, sem devolutiva.","Atribuir notas com o objetivo principal de classificar e hierarquizar os alunos.","Considerar o erro como falta de capacidade definitiva do aluno."],a:1,e:"Hoffmann defende a avaliação mediadora como processo contínuo de interpretação e intervenção, valorizando o erro como etapa da aprendizagem."},
{c:"No início do ano letivo, uma professora do 3º ano do ensino fundamental aplica uma atividade de sondagem para identificar o que seus alunos já sabem sobre o sistema de numeração decimal. Com base nos resultados, ela reorganiza seu planejamento, agrupando os estudantes por necessidades semelhantes e propondo intervenções específicas.",t:"Essa prática caracteriza-se como avaliação:",o:["Diagnóstica e formativa.","Apenas burocrática, sem função pedagógica.","Normativa e excludente.","Classificatória e somativa.","Somativa e seletiva."],a:0,e:"A avaliação diagnóstica identifica saberes prévios e, ao orientar o replanejamento, cumpre função formativa, acompanhando o processo."},
{c:"A Lei Brasileira de Inclusão da Pessoa com Deficiência (Lei nº 13.146/2015) e a Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva estabelecem diretrizes claras para o atendimento educacional. A legislação é enfática ao afirmar que o sistema educacional deve ser inclusivo em todos os níveis, garantindo que os estudantes com deficiência tenham acesso ao mesmo currículo que os demais, com os apoios necessários.",t:"De acordo com a legislação vigente, é correto afirmar que:",o:["O sistema educacional deve assegurar atendimento educacional especializado (AEE) preferencialmente na rede regular de ensino, de forma complementar ou suplementar.","Estudantes com deficiência não podem frequentar o ensino regular após os 14 anos.","O AEE deve substituir integralmente a escolarização regular.","A inclusão escolar é facultativa e depende da decisão exclusiva do diretor.","Estudantes com deficiência devem ser matriculados exclusivamente em escolas especiais."],a:0,e:"A LBI e a LDB asseguram o AEE como complemento ou suplemento à escolarização, preferencialmente na rede regular, sendo vedada a cobrança de valores adicionais."},
{c:"Uma escola pública recebe, pela primeira vez, um estudante com Transtorno do Espectro Autista (TEA). A equipe gestora e pedagógica precisa organizar ações para garantir sua aprendizagem, permanência e participação plena, em conformidade com a legislação específica que protege os direitos dessa população.",t:"Segundo a Lei nº 12.764/2012 (Política Nacional de Proteção dos Direitos da Pessoa com TEA), o estudante com TEA:",o:["Não tem direito a acompanhante especializado em casos comprovados de necessidade.","Deve ser matriculado obrigatoriamente em escolas especiais.","É considerado pessoa com deficiência para todos os efeitos legais.","Está dispensado de qualquer avaliação ao longo da escolarização.","Não pode participar de atividades físicas e artísticas."],a:2,e:"O art. 1º, §2º da Lei 12.764/2012 considera a pessoa com TEA como pessoa com deficiência para todos os efeitos legais, garantindo os direitos previstos na LBI."},
{c:"O Plano Nacional de Educação (PNE), Lei nº 13.005/2014, estabelece 20 metas e estratégias para a educação brasileira no decênio 2014-2024. A Meta 1 do PNE trata especificamente da educação infantil, visando à universalização do atendimento escolar e à ampliação da oferta de vagas, com o objetivo de reduzir as desigualdades regionais e sociais no acesso à primeira etapa da educação básica.",t:"Nesse sentido, o PNE prevê a universalização, até 2016, do atendimento:",o:["De toda a educação básica, do 1º ano do fundamental ao 3º ano do médio.","Do ensino superior a 100% da população de 18 a 24 anos.","Exclusivamente do ensino médio integral.","Da educação de jovens e adultos em nível superior.","Da pré-escola às crianças de 4 e 5 anos e a ampliação da oferta de vagas em creches para crianças de até 3 anos."],a:4,e:"A Meta 1 do PNE prevê a universalização da pré-escola (4 e 5 anos) e a ampliação da oferta de creches, com taxa de pelo menos 50% das crianças de 0 a 3 anos."},
{c:"O PNE também trata da valorização dos profissionais da educação como um dos pilares para a melhoria da qualidade do ensino. A Meta 17 do plano estabelece parâmetros remuneratórios e de formação para professores e demais profissionais da educação básica, visando a equiparação salarial e a valorização da carreira.",t:"De acordo com a Meta 17 do PNE, é objetivo estratégico:",o:["Eliminar a formação continuada dos professores.","Valorizar os profissionais do magistério das redes públicas, aproximando sua remuneração dos demais profissionais com escolaridade equivalente.","Substituir os professores efetivos por contratos temporários em todas as redes.","Desvincular a carreira do magistério de qualquer plano de carreira.","Reduzir o piso salarial nacional do magistério."],a:1,e:"A Meta 17 do PNE busca valorizar os profissionais do magistério, aproximando sua remuneração da de outros profissionais com escolaridade equivalente."},
{c:"As metodologias ativas têm sido cada vez mais incorporadas ao cotidiano escolar, em consonância com as competências gerais da BNCC, que valorizam a autonomia, a colaboração e o protagonismo estudantil. Essas metodologias deslocam o foco do ensino para a aprendizagem, colocando o estudante no centro do processo.",t:"Dentre as práticas pedagógicas consideradas metodologias ativas, destaca-se:",o:["Cópia prolongada do quadro-negro como única estratégia de registro.","Sala de aula invertida, em que os estudantes estudam previamente o conteúdo e o tempo em sala é utilizado para atividades práticas e discussões.","Separação rígida dos alunos por desempenho, sem interação entre os grupos.","Aula exclusivamente expositiva e dialogada apenas com a primeira fileira.","Provas escritas mensais como único instrumento avaliativo."],a:1,e:"A sala de aula invertida é uma metodologia ativa que desloca a transmissão de conteúdo para fora da sala, aproveitando o tempo presencial para atividades de maior engajamento."},
{c:"Uma professora do 6º ano organiza um projeto interdisciplinar em que os estudantes investigam problemas ambientais do bairro e propõem soluções à comunidade. O trabalho envolve Ciências, Geografia, Língua Portuguesa e Matemática, exigindo pesquisa de campo, produção de textos e análise de dados.",t:"Essa proposta pedagógica caracteriza-se como:",o:["Atividade extracurricular sem vínculo com o currículo.","Avaliação somativa ao final do bimestre.","Ensino fragmentado por disciplinas isoladas.","Aula tradicional centrada no livro didático.","Aprendizagem baseada em projetos (PBL), com abordagem interdisciplinar e contextualizada."],a:4,e:"A Aprendizagem Baseada em Projetos (PBL) articula saberes de diferentes áreas em torno de um problema real, promovendo protagonismo e contextualização."},
{c:"Paulo Freire, em sua obra 'Pedagogia do Oprimido', critica o que denomina 'educação bancária', na qual o educador 'deposita' conteúdos no educando, tratado como recipiente vazio. Em contrapartida, Freire propõe uma educação problematizadora e dialógica, em que educador e educando aprendem juntos, mediando o conhecimento a partir da realidade e dos saberes prévios dos estudantes.",t:"Segundo Paulo Freire, a educação bancária se caracteriza por:",o:["Promover o diálogo horizontal entre educador e educando.","Considerar o educando como sujeito ativo do processo de conhecimento.","Estimular a leitura crítica do mundo.","Valorizar os saberes prévios dos estudantes como ponto de partida.","Tratar o educando como depositário passivo de conteúdos transmitidos pelo educador."],a:4,e:"Na educação bancária, o educador 'deposita' conteúdos no educando, tratado como recipiente vazio, o que anula sua capacidade crítica e criadora."},
{c:"O Estatuto da Criança e do Adolescente (ECA - Lei nº 8.069/1990) estabelece os direitos fundamentais da criança e do adolescente, incluindo o direito à educação. A legislação impõe deveres específicos aos pais ou responsáveis para garantir que esse direito seja efetivado, sob pena de responsabilização.",t:"De acordo com o ECA, é dever dos pais ou responsáveis:",o:["Decidir livremente se os filhos frequentarão a escola ou não, até os 14 anos.","Substituir a escolarização por trabalho doméstico em qualquer idade.","Efetuar a matrícula de seus filhos na rede regular de ensino, sendo obrigatória a frequência à escola apenas a partir dos 7 anos.","Matricular seus filhos em qualquer instituição, inclusive não reconhecida pelo poder público.","Efetuar a matrícula de seus filhos na rede regular de ensino, sendo obrigatória a frequência a partir dos 4 anos, conforme alterações da Lei nº 12.796/2013."],a:4,e:"O ECA, com alterações da Lei 12.796/2013, obriga a matrícula e a frequência escolar a partir dos 4 anos, sendo dever dos pais zelar por esse direito."},
{c:"O currículo escolar é um campo de disputas e decisões que envolve conhecimentos, valores e práticas sociais. Segundo autores da teoria crítica do currículo, como Tomaz Tadeu da Silva, o currículo não é um documento neutro ou inocente. Ele reflete relações de poder e interesses de grupos sociais específicos.",t:"De acordo com a perspectiva crítica de currículo, é correto afirmar que:",o:["O currículo deve ser idêntico em todas as escolas, independentemente do contexto.","O currículo reflete relações de poder, selecionando saberes de grupos dominantes e silenciando outros.","O currículo não precisa dialogar com a realidade dos estudantes.","O currículo é um conjunto neutro de conteúdos a serem transmitidos.","O currículo deve ser definido exclusivamente por editoras de livros didáticos."],a:1,e:"A teoria crítica do currículo evidencia que ele expressa relações de poder, selecionando certos saberes em detrimento de outros, conforme interesses de grupos sociais."},
{c:"Uma professora do 3º ano do ensino fundamental percebe que alguns alunos apresentam dificuldades de leitura e escrita, embora não tenham sido diagnosticados com qualquer transtorno. Ela decide realizar intervenções pedagógicas diferenciadas em pequenos grupos, adaptando materiais e estratégias.",t:"Essa prática está em consonância com a perspectiva da:",o:["Pedagogia tradicional, que homogeneíza a turma.","Educação especial exclusiva para alunos com laudo médico.","Exclusão dos alunos com dificuldade para não prejudicar o andamento da turma.","Classificação por QI.","Educação inclusiva, que prevê atendimento às necessidades de todos os alunos, com ou sem deficiência."],a:4,e:"A educação inclusiva pressupõe o atendimento às necessidades de todos os alunos, com flexibilizações e apoios pedagógicos, independentemente de diagnóstico."},
{c:"As Diretrizes Curriculares Nacionais para a Educação Infantil (DCNEI - Resolução CNE/CEB nº 5/2009) definem os princípios e fundamentos para a organização de propostas pedagógicas nessa etapa. O documento enfatiza que a criança é um sujeito histórico e de direitos, que constrói sua identidade nas interações com seus pares e com a cultura.",t:"De acordo com as DCNEI, a proposta pedagógica para a educação infantil deve garantir:",o:["A antecipação da alfabetização formal a partir dos 2 anos.","A reprodução mecânica de conteúdos do ensino fundamental.","A avaliação por provas escritas bimestrais.","A organização de atividades que articulem cuidados e educação, por meio de interações, brincadeira e linguagem diversificadas.","A separação rígida entre cuidar e educar, delegando o cuidado às famílias."],a:3,e:"As DCNEI definem interações e brincadeira como eixos norteadores, articulando cuidados e educação na educação infantil."},
{c:"A Resolução CNE/CEB nº 5/2009 também estabelece práticas que devem ser evitadas na educação infantil, em respeito ao desenvolvimento integral da criança e à especificidade dessa etapa da educação básica.",t:"De acordo com essa resolução, é vedado na educação infantil:",o:["A realização de provas escritas formais e a retenção de crianças na pré-escola.","A participação das famílias em eventos escolares.","O registro das trajetórias individuais das crianças por meio de portfólios.","O contato com a natureza e atividades ao ar livre.","O uso de músicas, danças e brincadeiras."],a:0,e:"A resolução veda a avaliação com objetivo de promoção ou retenção na pré-escola, bem como práticas inadequadas à faixa etária, como provas formais."},
{c:"A escolha dos dirigentes escolares é um tema central na discussão sobre gestão democrática. A LDB, em seu artigo 14, parágrafo único, abre espaço para que os sistemas de ensino estabeleçam normas para a participação da comunidade nesse processo, visando à legitimidade e à transparência da gestão.",t:"Sobre a escolha de dirigentes escolares, a LDB estabelece que:",o:["Os sistemas de ensino poderão adotar mecanismos de participação da comunidade na escolha dos dirigentes, conforme normas dos respectivos sistemas.","A LDB não trata da escolha de dirigentes escolares.","A escolha é sempre por concurso público de provas e títulos, sem participação da comunidade.","A escolha de dirigentes escolares será feita exclusivamente por indicação política.","A escolha é sempre por sorteio entre os professores."],a:0,e:"O art. 14, parágrafo único da LDB prevê que os sistemas de ensino poderão adotar mecanismos de participação da comunidade na escolha dos dirigentes escolares."},
{c:"As avaliações em larga escala, como o SAEB (Sistema de Avaliação da Educação Básica), fornecem dados importantes sobre o desempenho dos estudantes e das redes de ensino. Esses dados são utilizados para a formulação de políticas públicas e para o monitoramento da qualidade da educação no país.",t:"Sobre as avaliações em larga escala, é correto afirmar que:",o:["Definem, isoladamente, a promoção ou retenção de cada aluno.","Não têm relação com os currículos escolares.","Devem ser o único instrumento avaliativo das redes de ensino.","São aplicadas apenas a estudantes do ensino superior.","Permitem diagnosticar o desempenho de redes e sistemas, orientando políticas públicas, mas não substituem a avaliação formativa realizada em sala de aula."],a:4,e:"As avaliações em larga escala fornecem indicadores para políticas públicas, mas não substituem a avaliação formativa e processual realizada cotidianamente pelos professores."},
{c:"Uma professora do 5º ano percebe que um aluno migrante recém-chegado apresenta dificuldades com a língua portuguesa, embora demonstre bom desempenho em outras áreas. Ela decide organizar atividades que valorizem a cultura de origem do estudante, promovendo o diálogo entre diferentes saberes.",t:"Essa prática está em consonância com:",o:["A imposição de um único modelo cultural como referência.","A perspectiva intercultural, que valoriza a diversidade e o diálogo entre diferentes culturas no espaço escolar.","A homogeneização cultural imposta pela escola.","A exclusão do estudante até que domine o português.","A assimilação forçada do estudante à cultura local."],a:1,e:"A perspectiva intercultural valoriza o diálogo entre diferentes culturas, reconhecendo a diversidade como riqueza no processo educativo."},
{c:"A Lei nº 10.639/2003 alterou a LDB para incluir a obrigatoriedade do estudo da história e cultura afro-brasileira e africana no currículo da educação básica. Essa legislação representa um marco na luta contra o racismo e pela valorização da contribuição dos povos africanos para a formação da sociedade brasileira.",t:"De acordo com essa lei, o conteúdo programático a ser incluído no currículo deverá abranger:",o:["O estudo da história da África e dos africanos, a luta dos negros no Brasil, a cultura negra brasileira e o negro na formação da sociedade nacional.","Apenas a história dos países europeus.","Apenas o período colonial brasileiro.","Exclusivamente a literatura europeia.","Conteúdos apenas no ensino médio."],a:0,e:"A Lei 10.639/2003 inclui no currículo o estudo da história da África e dos africanos, a luta dos negros no Brasil, a cultura negra brasileira e o negro na formação da sociedade."},
{c:"A Lei nº 11.645/2008 ampliou a obrigatoriedade curricular prevista na Lei 10.639/2003, incluindo também o estudo da história e cultura dos povos indígenas. Essa ampliação visa combater preconceitos e promover o reconhecimento da diversidade étnica que compõe o Brasil.",t:"De acordo com essa legislação, o estudo das histórias e culturas indígenas e afro-brasileiras deve ser desenvolvido:",o:["No âmbito de todo o currículo escolar, em especial nas áreas de educação artística, literatura e história brasileiras.","Apenas em escolas localizadas em comunidades indígenas.","Apenas em aulas de História.","De forma facultativa, a critério do professor.","Somente no ensino médio."],a:0,e:"A Lei 11.645/2008 determina que o conteúdo seja trabalhado em todo o currículo, especialmente em educação artística, literatura e história."},
{c:"A Educação de Jovens e Adultos (EJA) é uma modalidade da educação básica prevista na LDB, destinada a aqueles que não tiveram acesso ou continuidade de estudos na idade própria. A legislação prevê que essa modalidade deve considerar as características, interesses e condições de vida e trabalho dos estudantes.",t:"Sobre a EJA, é correto afirmar que:",o:["Não precisa seguir diretrizes curriculares nacionais.","Não pode ser ofertada a distância em nenhuma hipótese.","Destina-se apenas a menores de 18 anos.","Deve garantir gratuitamente aos que não tiveram acesso à educação na idade própria oportunidades educacionais apropriadas, consideradas as características do alunado.","É destinada exclusivamente a trabalhadores com vínculo empregatício formal."],a:3,e:"O art. 37 da LDB prevê que a EJA destinará gratuitamente oportunidades educacionais apropriadas, consideradas as características do alunado, seus interesses e condições de vida e trabalho."},
{c:"A organização do calendário e da carga horária escolar é uma atribuição dos sistemas de ensino, mas deve obedecer aos mínimos estabelecidos pela legislação federal para garantir a qualidade e a equidade na oferta educacional em todo o país.",t:"De acordo com a LDB, a carga horária mínima anual para a educação básica é de:",o:["400 horas, distribuídas por um mínimo de 100 dias letivos.","800 horas, distribuídas por um mínimo de 200 dias de efetivo trabalho escolar, excluído o tempo reservado a exames finais.","600 horas, distribuídas por um mínimo de 150 dias de efetivo trabalho escolar.","1.000 horas, distribuídas por um mínimo de 250 dias letivos.","1.200 horas, distribuídas por um mínimo de 220 dias letivos."],a:1,e:"O art. 24, I da LDB estabelece carga horária mínima anual de 800 horas, distribuídas por um mínimo de 200 dias de efetivo trabalho escolar, excluído o tempo de exames finais."},
{c:"A formação continuada de professores é considerada um dos pilares da valorização do magistério e da melhoria da qualidade da educação. As políticas educacionais contemporâneas enfatizam que a formação não termina com a graduação, mas é um processo permanente que ocorre ao longo de toda a carreira docente.",t:"De acordo com a LDB e as políticas educacionais contemporâneas, a formação continuada deve:",o:["Ser esporádica e desvinculada da prática pedagógica.","Ser obrigatoriamente realizada em instituições privadas.","Desconsiderar os saberes experienciais dos professores.","Ser realizada apenas no início da carreira.","Ser entendida como processo permanente, articulado com a prática docente, as necessidades da escola e os projetos pedagógicos."],a:4,e:"A formação continuada é um processo permanente, articulado com a prática e com o contexto escolar, valorizando saberes experienciais e teóricos."},
{c:"A BNCC do ensino médio, homologada em 2018, trouxe mudanças significativas na organização curricular dessa etapa. O documento busca ampliar a flexibilidade e o protagonismo dos estudantes, permitindo que eles escolham percursos formativos alinhados aos seus projetos de vida.",t:"Sobre o ensino médio previsto na BNCC, é correto afirmar que:",o:["Não prevê o desenvolvimento de competências e habilidades.","Mantém-se idêntico ao modelo do século XIX.","Organiza-se em áreas de conhecimento e prevê itinerários formativos que podem ser escolhidos pelos estudantes.","Elimina qualquer componente da formação geral básica.","Mantém a estrutura exclusivamente disciplinar, sem áreas de conhecimento."],a:2,e:"A BNCC do ensino médio organiza-se em áreas de conhecimento e prevê itinerários formativos, ampliando a flexibilidade e o protagonismo estudantil."},
{c:"Uma professora do ensino fundamental II decide utilizar a gamificação em suas aulas de Ciências, criando missões, níveis e recompensas simbólicas para engajar os estudantes no estudo do sistema solar. A estratégia visa aumentar a motivação e a participação ativa dos alunos.",t:"Essa prática caracteriza-se como:",o:["Substituição do currículo por entretenimento puro.","Avaliação somativa tradicional.","Atividade de reforço sem vínculo curricular.","Metodologia ativa que utiliza elementos de jogos para engajar os estudantes e promover aprendizagens significativas.","Aula tradicional expositiva."],a:3,e:"A gamificação utiliza elementos de jogos para engajar os estudantes e promover aprendizagens significativas, sendo uma metodologia ativa."},
{c:"Maurice Tardif, em seus estudos sobre a profissão docente, argumenta que o professor mobiliza diferentes tipos de saberes em sua prática cotidiana. Esses saberes não são apenas teóricos, mas também práticos, construídos na experiência e na interação com os alunos e com o contexto escolar.",t:"De acordo com Tardif, os saberes docentes incluem:",o:["Apenas saberes transmitidos pelos livros didáticos.","Saberes improvisados, sem base teórica.","Exclusivamente saberes teóricos adquiridos na formação inicial.","Apenas saberes disciplinares, desconsiderando a experiência.","Saberes disciplinares, curriculares, das ciências da educação e experienciais, construídos no cotidiano da profissão."],a:4,e:"Tardif identifica saberes disciplinares, curriculares, das ciências da educação e experienciais, construídos na prática cotidiana dos professores."},
{c:"A educação ambiental é um tema transversal previsto nas diretrizes curriculares nacionais. A Lei nº 9.795/1999, que institui a Política Nacional de Educação Ambiental, estabelece que essa dimensão deve estar presente em todos os níveis e modalidades de ensino, de forma integrada e contínua.",t:"Um projeto de horta escolar e compostagem está em consonância com:",o:["A exclusão da comunidade do processo educativo.","A obrigatoriedade de uma disciplina específica chamada 'Educação Ambiental', isolada das demais.","A Política Nacional de Educação Ambiental, que prevê a educação ambiental em todos os níveis e modalidades de ensino, de forma transversal e interdisciplinar.","A restrição da educação ambiental ao ensino superior.","A ausência de vínculo com o currículo escolar."],a:2,e:"A Lei 9.795/1999 estabelece que a educação ambiental deve ser desenvolvida como prática educativa integrada, contínua e permanente em todos os níveis e modalidades, de forma transversal."},
{c:"A relação entre escola e família é um dos temas centrais da educação contemporânea. O ECA e a LDB reforçam a importância dessa parceria para a garantia do direito à educação e para o desenvolvimento integral das crianças e adolescentes.",t:"Sobre a relação entre escola e família, é correto afirmar que:",o:["A família deve transferir integralmente a educação para a escola.","A parceria entre escola e família é fundamental para o sucesso educativo, devendo ser construída por meio de diálogo, participação e corresponsabilidade.","As famílias não precisam acompanhar a vida escolar dos filhos.","A escola é a única responsável pela educação das crianças.","A escola deve excluir as famílias dos processos decisórios."],a:1,e:"A parceria entre escola e família é essencial, baseada em diálogo, participação e corresponsabilidade pela educação integral das crianças e adolescentes."},
{c:"José Carlos Libâneo, em suas obras sobre didática e organização do trabalho pedagógico, destaca a importância do planejamento escolar. Para o autor, o planejamento não é um mero preenchimento de formulários, mas um processo de previsão e organização da ação educativa.",t:"De acordo com Libâneo, o planejamento escolar tem como funções:",o:["Prever, organizar e orientar a ação educativa, articulando objetivos, conteúdos, métodos e avaliação, de forma flexível e passível de reelaboração.","Substituir a ação docente por formulários preenchidos.","Impedir qualquer alteração no percurso previsto.","Reproduzir modelos prontos, sem considerar o contexto.","Apenas burocráticas, para cumprir exigências da secretaria de educação."],a:0,e:"Libâneo destaca que o planejamento prevê, organiza e orienta a ação educativa, sendo flexível e passível de reelaboração conforme o contexto."},
{c:"Uma professora do 2º ano do ensino fundamental percebe que um aluno, apesar de apresentar bom desempenho oral, tem dificuldade em registrar suas ideias por escrito. Ela decide utilizar diferentes estratégias, como rodas de leitura, produção coletiva de textos e uso de tecnologias.",t:"Essa prática está em consonância com:",o:["A homogeneização da turma, ignorando as diferenças.","A imposição de um único ritmo de aprendizagem.","A perspectiva da diversidade e da inclusão, que reconhece os diferentes ritmos e estilos de aprendizagem e propõe múltiplas estratégias pedagógicas.","A retenção automática do aluno, sem intervenção.","A exclusão do aluno das atividades de escrita."],a:2,e:"A perspectiva inclusiva reconhece a diversidade dos ritmos e estilos de aprendizagem e propõe múltiplas estratégias para atender a todos os estudantes."},
{c:"A BNCC prevê o desenvolvimento de competências socioemocionais como parte da formação integral dos estudantes. Essas competências envolvem aspectos como autoconhecimento, empatia, responsabilidade, resiliência e colaboração, e devem ser trabalhadas em articulação com as competências cognitivas.",t:"Sobre as competências socioemocionais previstas na BNCC, é correto afirmar que:",o:["São responsabilidade exclusiva da família.","Devem ser desenvolvidas apenas no ensino médio.","Devem ser avaliadas apenas por provas escritas.","São irrelevantes para o sucesso escolar.","São parte da formação integral dos estudantes e devem ser desenvolvidas ao longo de toda a educação básica, em articulação com as competências cognitivas."],a:4,e:"A BNCC prevê o desenvolvimento de competências socioemocionais ao longo de toda a educação básica, em articulação com as cognitivas, visando a formação integral."},
{c:"Uma escola está organizando um projeto de leitura em que os estudantes escolhem livros de seu interesse, organizam clubes de leitura e compartilham suas experiências com a comunidade escolar. O objetivo é formar leitores autônomos e críticos.",t:"Esse projeto está em consonância com:",o:["A imposição de uma lista única de livros clássicos, sem escolha dos estudantes.","A formação de leitores autônomos e críticos, por meio do acesso a diferentes gêneros textuais e da valorização do protagonismo estudantil.","A restrição da leitura a textos didáticos.","A exclusão da comunidade escolar do processo.","A proibição de livros de literatura brasileira."],a:1,e:"Projetos de leitura que valorizam a escolha, o compartilhamento e o protagonismo estudantil contribuem para a formação de leitores autônomos e críticos."},
{c:"O Exame Nacional do Ensino Médio (ENEM) é uma avaliação em larga escala que possui múltiplas finalidades no sistema educacional brasileiro. Criado em 1998, o exame evoluiu ao longo dos anos e hoje é uma porta de entrada fundamental para o ensino superior.",t:"Sobre o ENEM, é correto afirmar que:",o:["Não tem relação com a BNCC.","Avalia apenas conhecimentos de Língua Portuguesa e Matemática.","Pode ser utilizado para seleção de estudantes para o ensino superior, para certificação do ensino médio (em contextos específicos) e como critério para acesso a programas como o ProUni e o FIES.","Substitui integralmente o vestibular em todas as universidades.","É utilizado exclusivamente para seleção de estudantes para o ensino superior público, sem outras finalidades."],a:2,e:"O ENEM tem múltiplas finalidades: seleção para o ensino superior (SISU), acesso ao ProUni e FIES, e pode ser utilizado para certificação do ensino médio em contextos específicos."},
{c:"Uma professora do ensino fundamental I decide utilizar a avaliação por portfólios, em que os estudantes organizam coletâneas de suas produções ao longo do bimestre, refletindo sobre suas aprendizagens e selecionando os trabalhos que consideram mais significativos.",t:"Essa prática caracteriza-se como:",o:["Avaliação normativa, comparando os estudantes entre si.","Avaliação classificatória, baseada em notas.","Avaliação somativa, ao final do bimestre.","Avaliação diagnóstica, apenas no início do ano.","Avaliação formativa e processual, que valoriza a trajetória de aprendizagem do estudante e promove a autorreflexão."],a:4,e:"O portfólio é um instrumento de avaliação formativa e processual, que valoriza a trajetória de aprendizagem e promove a autorreflexão do estudante."},
{c:"A educação em direitos humanos é um tema transversal previsto nas diretrizes curriculares nacionais e deve permear todo o trabalho pedagógico, visando à formação de cidadãos conscientes de seus direitos e deveres.",t:"De acordo com as Diretrizes Curriculares Nacionais para a Educação em Direitos Humanos (Resolução CNE/CP nº 1/2012), a educação em direitos humanos deve:",o:["Ser facultativa, a critério da escola.","Ser restrita ao ensino superior.","Desconsiderar a realidade local dos estudantes.","Ser tratada apenas em aulas de História.","Permeiar todo o currículo escolar, de forma transversal e interdisciplinar, promovendo a cultura dos direitos humanos."],a:4,e:"As DCN para Educação em Direitos Humanos prevêem que o tema deve permear todo o currículo, de forma transversal e interdisciplinar, promovendo a cultura dos direitos humanos."},
{c:"O Projeto Político-Pedagógico (PPP) é o documento que expressa a identidade da escola, seus princípios, objetivos e ações pedagógicas. Sua construção deve ser coletiva, envolvendo toda a comunidade escolar, e deve ser visto como um instrumento vivo, passível de reelaboração.",t:"Sobre o projeto político-pedagógico, é correto afirmar que:",o:["É um documento construído coletivamente, que expressa a identidade da escola, seus princípios, objetivos e ações pedagógicas, devendo ser reelaborado periodicamente.","Não precisa ser conhecido pelos professores.","Deve ser elaborado exclusivamente pela direção da escola, sem participação da comunidade.","É imutável e não pode ser alterado após sua aprovação.","É um documento burocrático, sem relação com a prática pedagógica."],a:0,e:"O PPP é um documento construído coletivamente, que expressa a identidade da escola e deve ser reelaborado periodicamente, com participação de toda a comunidade escolar."},

];

let current = 0;
let answers = new Array(Q.length).fill(null);

/* ===================== FIREBASE ===================== */
// ⚠️ Substitua pelos dados do SEU projeto (Firebase Console → Configurações do projeto)
const firebaseConfig = {
  apiKey: "SUA_API_KEY_AQUI",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const REQUESTS_COLLECTION = 'solicitacoes';

/* ===================== ACESSO / CADASTRO POR E-MAIL ===================== */

const STORAGE_USER_EMAIL = 'simulado_userEmail';

function sanitizeEmail(email) { return email.trim().toLowerCase(); }
function isValidEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

async function init() {
  const email = localStorage.getItem(STORAGE_USER_EMAIL);
  if (!email) { renderEmailGate(); return; }
  await checkStatus(email);
}

async function checkStatus(email) {
  renderLoading('Verificando seu acesso…');
  try {
    const snap = await db.collection(REQUESTS_COLLECTION).doc(sanitizeEmail(email)).get();
    if (!snap.exists) { renderEmailGate(); return; }
    const data = snap.data();
    if (data.status === 'approved') renderStart();
    else if (data.status === 'rejected') renderGateStatus('rejected', email);
    else renderGateStatus('pending', email);
  } catch (e) {
    renderGateError('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.');
  }
}

function renderLoading(msg) {
  document.getElementById('main').innerHTML = `<div class="gate-screen"><p>${msg}</p></div>`;
}

function renderGateError(msg) {
  document.getElementById('main').innerHTML = `
    <div class="gate-screen">
      <span class="status-badge rejected">Erro de conexão</span>
      <h2>Algo deu errado</h2>
      <p>${msg}</p>
      <button onclick="init()">Tentar novamente</button>
    </div>`;
}

function renderEmailGate() {
  document.getElementById('main').innerHTML = `
    <div class="gate-screen">
      <h2>Cadastro de acesso</h2>
      <p>Informe seu e-mail para solicitar acesso ao simulado. Um administrador precisa aprovar seu cadastro antes que você possa começar.</p>
      <div class="form-field">
        <label for="emailInput">E-mail</label>
        <input type="email" id="emailInput" placeholder="seuemail@exemplo.com" autocomplete="email">
      </div>
      <div class="error-msg" id="emailError">Informe um e-mail válido.</div>
      <button class="success" onclick="submitEmailRequest()" style="padding:14px 32px; font-size:1.05rem;">Solicitar acesso</button>
    </div>`;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('infoLeft').textContent = 'Cadastro necessário';
  document.getElementById('infoRight').textContent = '50 questões';
}

async function submitEmailRequest() {
  const input = document.getElementById('emailInput');
  const email = sanitizeEmail(input.value);
  const errorEl = document.getElementById('emailError');

  if (!isValidEmail(email)) {
    errorEl.classList.add('show');
    return;
  }
  errorEl.classList.remove('show');
  localStorage.setItem(STORAGE_USER_EMAIL, email);

  renderLoading('Enviando solicitação…');
  try {
    const docRef = db.collection(REQUESTS_COLLECTION).doc(email);
    const snap = await docRef.get();
    if (!snap.exists) {
      await docRef.set({
        email,
        status: 'pending',
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    await checkStatus(email);
  } catch (e) {
    renderGateError('Não foi possível enviar sua solicitação. Tente novamente em instantes.');
  }
}

function renderGateStatus(status, email) {
  let badge = '', title = '', text = '', extraBtn = '';
  if (status === 'pending') {
    badge = '<span class="status-badge pending">Aguardando aprovação</span>';
    title = 'Solicitação enviada';
    text = `O e-mail <strong>${email}</strong> foi registrado e está aguardando a aprovação do administrador. Volte a esta página mais tarde para verificar se o acesso já foi liberado.`;
    extraBtn = `<button class="secondary" onclick="checkAccessAgain()">Verificar novamente</button>`;
  } else {
    badge = '<span class="status-badge rejected">Acesso não liberado</span>';
    title = 'Solicitação recusada';
    text = `O acesso para <strong>${email}</strong> não foi liberado pelo administrador. Você pode tentar com outro e-mail.`;
    extraBtn = `<button class="secondary" onclick="useAnotherEmail()">Usar outro e-mail</button>`;
  }
  document.getElementById('main').innerHTML = `
    <div class="gate-screen">
      ${badge}
      <h2>${title}</h2>
      <p>${text}</p>
      ${extraBtn}
    </div>`;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('infoLeft').textContent = 'Aguardando liberação';
  document.getElementById('infoRight').textContent = '50 questões';
}

function checkAccessAgain() { init(); }

function useAnotherEmail() {
  localStorage.removeItem(STORAGE_USER_EMAIL);
  renderEmailGate();
}

/* ===================== ÁREA DO ADMINISTRADOR ===================== */
// Login real via Firebase Authentication (e-mail + senha criados por você no
// Firebase Console → Authentication → Users). A proteção de verdade não é essa
// tela: é a regra do Firestore, que só aceita aprovações vindas de alguém
// autenticado. Assim, ninguém consegue aprovar o próprio e-mail abrindo o
// console do navegador e chamando a função diretamente.

function openAdminLogin() {
  if (auth.currentUser) { renderAdminPanel(); return; }
  document.getElementById('main').innerHTML = `
    <div class="gate-screen">
      <h2>Área do administrador</h2>
      <p>Entre com a conta de administrador cadastrada no Firebase.</p>
      <div class="form-field">
        <label for="adminEmail">E-mail</label>
        <input type="email" id="adminEmail" placeholder="admin@seudominio.com" autocomplete="username">
      </div>
      <div class="form-field">
        <label for="adminPass">Senha</label>
        <input type="password" id="adminPass" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') adminLogin()">
      </div>
      <div class="error-msg" id="adminError">E-mail ou senha incorretos.</div>
      <button onclick="adminLogin()" style="padding:14px 32px; font-size:1.05rem;">Entrar</button>
      <br><br>
      <button class="secondary" onclick="init()">Voltar</button>
    </div>`;
  document.getElementById('infoLeft').textContent = 'Área do administrador';
  document.getElementById('infoRight').textContent = '';
}

async function adminLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value;
  const errorEl = document.getElementById('adminError');
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    errorEl.classList.remove('show');
    renderAdminPanel();
  } catch (e) {
    errorEl.classList.add('show');
  }
}

async function renderAdminPanel() {
  renderLoading('Carregando solicitações…');
  document.getElementById('infoLeft').textContent = 'Área do administrador';

  let all = [];
  try {
    const snap = await db.collection(REQUESTS_COLLECTION).get();
    snap.forEach(doc => all.push(doc.data()));
  } catch (e) {
    renderGateError('Não foi possível carregar as solicitações. Verifique sua conexão e as regras do Firestore.');
    return;
  }

  const pending = all.filter(r => r.status === 'pending');
  const approved = all.filter(r => r.status === 'approved');

  let pendingRows = pending.map(r => `
    <tr>
      <td>${r.email}</td>
      <td class="admin-actions">
        <button class="success" onclick="approveEmail('${r.email}')">Aprovar</button>
        <button class="secondary" onclick="rejectEmail('${r.email}')">Recusar</button>
      </td>
    </tr>`).join('');
  if (!pending.length) pendingRows = `<tr><td colspan="2" class="admin-empty">Nenhuma solicitação pendente.</td></tr>`;

  let approvedRows = approved.map(r => `
    <tr>
      <td>${r.email}</td>
      <td class="admin-actions">
        <button class="secondary" onclick="revokeEmail('${r.email}')">Revogar acesso</button>
      </td>
    </tr>`).join('');
  if (!approved.length) approvedRows = `<tr><td colspan="2" class="admin-empty">Nenhum e-mail aprovado ainda.</td></tr>`;

  document.getElementById('main').innerHTML = `
    <div class="gate-screen" style="text-align:left; max-width:700px; margin:0 auto;">
      <h2 style="text-align:center;">Painel do administrador</h2>
      <h3 style="color:#0d2a52; margin:22px 0 8px;">Solicitações pendentes</h3>
      <table class="admin-table">
        <thead><tr><th>E-mail</th><th>Ação</th></tr></thead>
        <tbody>${pendingRows}</tbody>
      </table>
      <h3 style="color:#0d2a52; margin:22px 0 8px;">Acessos aprovados</h3>
      <table class="admin-table">
        <thead><tr><th>E-mail</th><th>Ação</th></tr></thead>
        <tbody>${approvedRows}</tbody>
      </table>
      <div style="text-align:center; margin-top:20px;">
        <button class="secondary" onclick="init()">Voltar ao simulado</button>
        <button class="secondary" onclick="adminLogout()">Sair da conta</button>
      </div>
    </div>`;
  document.getElementById('infoRight').textContent = `${pending.length} pendente(s) • ${approved.length} aprovado(s)`;
}

async function adminLogout() {
  await auth.signOut();
  init();
}

async function approveEmail(email) {
  await db.collection(REQUESTS_COLLECTION).doc(email).update({ status: 'approved' });
  renderAdminPanel();
}

async function rejectEmail(email) {
  await db.collection(REQUESTS_COLLECTION).doc(email).update({ status: 'rejected' });
  renderAdminPanel();
}

async function revokeEmail(email) {
  await db.collection(REQUESTS_COLLECTION).doc(email).update({ status: 'pending' });
  renderAdminPanel();
}

/* ===================== TELA INICIAL DO SIMULADO ===================== */

function renderStart() {
  document.getElementById('main').innerHTML = `
    <div class="start-screen">
      <h2>Bem-vindo(a) ao Simulado!</h2>
      <p>Teste seus conhecimentos com <strong>50 questões contextualizadas</strong>, voltadas para concursos da área da Educação.</p>
      <ul>
        <li>📖 <strong>Textos de apoio detalhados</strong> (leis, teorias e situações-problema)</li>
        <li>🎯 Questões de múltipla escolha (A a E)</li>
        <li>💡 Feedback explicativo ao final de cada questão</li>
        <li>📊 Resultado final com revisão detalhada de todas as questões</li>
      </ul>
      <button class="success" onclick="startQuiz()" style="margin-top:20px; padding:14px 32px; font-size:1.1rem;">Iniciar Simulado</button>
    </div>`;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('infoLeft').textContent = 'Aguardando início';
  document.getElementById('infoRight').textContent = '50 questões';
}

function startQuiz() {
  current = 0;
  answers = new Array(Q.length).fill(null);
  renderQuestion();
}

function renderQuestion() {
  const q = Q[current];
  const total = Q.length;
  const answered = answers.filter(a => a !== null).length;
  const correct = answers.filter((a, i) => a === Q[i].a).length;

  document.getElementById('progressBar').style.width = ((current + 1) / total * 100) + '%';
  document.getElementById('infoLeft').textContent = `Questão ${current + 1} de ${total}`;
  document.getElementById('infoRight').textContent = `Acertos: ${correct} | Respondidas: ${answered}`;

  let optionsHtml = '';
  q.o.forEach((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const checked = answers[current] === i ? 'checked' : '';
    const selectedClass = answers[current] === i ? 'selected' : '';
    optionsHtml += `<li class="${selectedClass}" onclick="selectOption(${i})">
      <input type="radio" name="q${current}" id="opt${i}" ${checked}>
      <label for="opt${i}"><strong>${letter})</strong> ${opt}</label>
    </li>`;
  });

  document.getElementById('main').innerHTML = `
    <div class="question-card active">
      <span class="q-number">Questão ${current + 1}</span>
      <div class="q-context">${q.c}</div>
      <div class="q-text">${q.t}</div>
      <ul class="options">${optionsHtml}</ul>
      <div class="nav-buttons">
        <button class="secondary" onclick="prevQuestion()" ${current === 0 ? 'disabled' : ''}>← Anterior</button>
        <button onclick="confirmAnswer()" ${answers[current] === null ? 'disabled' : ''}>Confirmar Resposta</button>
        ${current === total - 1 ? 
          `<button class="success" onclick="finishQuiz()">Finalizar Simulado</button>` : 
          `<button onclick="nextQuestion()">Próxima →</button>`
        }
      </div>
    </div>`;
}

function selectOption(i) {
  answers[current] = i;
  renderQuestion();
}

function confirmAnswer() {
  const q = Q[current];
  const userAnswer = answers[current];
  const isCorrect = userAnswer === q.a;

  const options = document.querySelectorAll('.options li');
  options.forEach((li, i) => {
    li.classList.remove('selected');
    if (i === q.a) li.classList.add('correct');
    if (i === userAnswer && !isCorrect) li.classList.add('wrong');
  });

  const feedbackDiv = document.createElement('div');
  feedbackDiv.className = `feedback show ${isCorrect ? 'ok' : 'no'}`;
  feedbackDiv.innerHTML = `<strong>${isCorrect ? '✓ Resposta correta!' : '✗ Resposta incorreta.'}</strong><br>${q.e}`;
  document.querySelector('.question-card').appendChild(feedbackDiv);
  document.querySelector('button[onclick="confirmAnswer()"]').disabled = true;
}

function nextQuestion() { if (current < Q.length - 1) { current++; renderQuestion(); } }
function prevQuestion() { if (current > 0) { current--; renderQuestion(); } }

function finishQuiz() {
  const total = Q.length;
  const correct = answers.filter((a, i) => a === Q[i].a).length;
  const percentage = Math.round((correct / total) * 100);

  let reviewHtml = '';
  Q.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.a;
    const userLetter = userAns !== null ? String.fromCharCode(65 + userAns) : 'Não respondida';
    const correctLetter = String.fromCharCode(65 + q.a);
    reviewHtml += `<div class="review-item ${isCorrect ? 'ok' : 'no'}">
      <strong>Questão ${i + 1}:</strong> ${isCorrect ? '✓ Correta' : '✗ Incorreta'}<br>
      <small>Sua resposta: ${userLetter} | Correta: ${correctLetter}</small>
    </div>`;
  });

  let message = '';
  if (percentage >= 80) message = '🎉 Excelente! Você está muito bem preparado(a)!';
  else if (percentage >= 60) message = '👍 Bom desempenho! Continue estudando!';
  else if (percentage >= 40) message = '📚 Razoável. Revise os conteúdos e pratique mais!';
  else message = '💪 Não desanime! Revise os conteúdos e continue praticando!';

  document.getElementById('main').innerHTML = `
    <div class="result-screen">
      <h2>Resultado Final</h2>
      <div class="score-big">${correct}/${total}</div>
      <div class="score-bar"><div class="score-fill" style="width: ${percentage}%"></div></div>
      <p style="font-size: 1.1rem; margin-bottom: 10px;"><strong>${percentage}% de acertos</strong></p>
      <p style="color: #555; margin-bottom: 20px;">${message}</p>
      <div class="review-list">
        <h3 style="margin-bottom: 12px; color: #0d2a52;">Revisão das Questões:</h3>
        ${reviewHtml}
      </div>
      <button class="success" onclick="startQuiz()" style="margin-right:10px;">Refazer Simulado</button>
      <button class="secondary" onclick="renderStart()">Voltar ao Início</button>
    </div>`;
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('infoLeft').textContent = 'Simulado finalizado';
  document.getElementById('infoRight').textContent = `${correct} acertos de ${total}`;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(console.error);
  });
}

init();
</script>
